<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b5998" stop-opacity="1" />
      <stop offset="100%" stop-color="#2b4170" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="1" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#cardGradient)" rx="20" ry="20" />
  
  <!-- Feature Cards -->
  <g transform="translate(60, 60)">
    <!-- Secure Access Card -->
    <rect width="320" height="180" fill="rgba(255, 255, 255, 0.1)" rx="15" ry="15" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
    <circle cx="80" cy="60" r="30" fill="none" stroke="white" stroke-width="3" />
    <text x="80" y="120" font-family="Arial" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Secure Access</text>
    <text x="80" y="150" font-family="Arial" font-size="16" fill="rgba(255, 255, 255, 0.8)" text-anchor="middle">Role-based authentication</text>
  </g>
  
  <g transform="translate(420, 60)">
    <!-- Fast Lookup Card -->
    <rect width="320" height="180" fill="rgba(255, 255, 255, 0.1)" rx="15" ry="15" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
    <path d="M80,40 L80,70 L100,55 Z" fill="#ff9933" stroke="none" />
    <text x="80" y="120" font-family="Arial" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Fast Lookup</text>
    <text x="80" y="150" font-family="Arial" font-size="16" fill="rgba(255, 255, 255, 0.8)" text-anchor="middle">Instant result retrieval</text>
  </g>
  
  <g transform="translate(60, 260)">
    <!-- Bulk Upload Card -->
    <rect width="320" height="180" fill="rgba(255, 255, 255, 0.1)" rx="15" ry="15" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
    <path d="M60,50 C60,40 70,30 80,30 C90,30 100,40 100,50 C110,30 130,30 140,50 C140,30 160,30 160,50 C160,80 120,90 100,70 C80,90 40,80 40,50 C40,30 60,30 60,50 Z" fill="white" />
    <text x="80" y="120" font-family="Arial" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Bulk Upload</text>
    <text x="80" y="150" font-family="Arial" font-size="16" fill="rgba(255, 255, 255, 0.8)" text-anchor="middle">CSV/XLSX imports</text>
  </g>
  
  <g transform="translate(420, 260)">
    <!-- Analytics Card -->
    <rect width="320" height="180" fill="rgba(255, 255, 255, 0.1)" rx="15" ry="15" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
    <polyline points="60,70 80,50 100,60 120,30 140,40" fill="none" stroke="white" stroke-width="2" />
    <text x="80" y="120" font-family="Arial" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Analytics</text>
    <text x="80" y="150" font-family="Arial" font-size="16" fill="rgba(255, 255, 255, 0.8)" text-anchor="middle">Performance insights</text>
  </g>
  
  <!-- System Status -->
  <g transform="translate(60, 480)">
    <rect width="680" height="100" fill="rgba(255, 255, 255, 0.1)" rx="15" ry="15" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
    <text x="80" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="white">System Status</text>
    <rect x="600" y="25" width="100" height="30" rx="15" ry="15" fill="rgba(79, 209, 197, 0.3)" />
    <text x="650" y="45" font-family="Arial" font-size="16" fill="#4fd1c5" text-anchor="middle">Operational</text>
    
    <!-- Progress Bar -->
    <rect x="80" y="60" width="520" height="10" rx="5" ry="5" fill="rgba(255, 255, 255, 0.2)" />
    <rect x="80" y="60" width="494" height="10" rx="5" ry="5" fill="url(#progressGradient)" />
    
    <text x="80" y="90" font-family="Arial" font-size="16" fill="rgba(255, 255, 255, 0.8)">99.9% uptime · All systems running smoothly</text>
  </g>
</svg>